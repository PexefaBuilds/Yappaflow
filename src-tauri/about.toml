# cargo-about config for THIRD_PARTY_NOTICES.md (release workflow, job `notices`).
# Keep `accepted` in step with deny.toml's allow list.
accepted = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "OFL-1.1",
  "MPL-2.0",
]
# The platforms we ship.
targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin", "x86_64-apple-darwin"]
ignore-dev-dependencies = true
private = { ignore = true }
workarounds = ["ring"]
