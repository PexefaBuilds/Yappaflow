<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Accent options</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;600;700&amp;family=Reem+Kufi:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1600px; height: 1000px; box-sizing: border-box; padding: 48px 56px; background: #ECEBE6; font-family: 'Unbounded', 'Reem Kufi', sans-serif; color: #1B1B1F; display: flex; flex-direction: column; gap: 28px">
  <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 32px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: #5E5E66">Settings › General › Accent</span>
      <h1 style="margin: 0; font-size: 34px; font-weight: 600; letter-spacing: -0.01em">Seven accents, the user picks</h1>
    </div>
    <p style="margin: 0; max-width: 560px; font-size: 12px; line-height: 1.7; font-weight: 300; color: #3A3A42">Azure is the default. With Coral or Tangerine, warnings switch to red. With Violet, command mode switches to coral. In light mode, text uses the deeper shade shown in each card's light panel.</p>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; flex-grow: 1" role="radiogroup" aria-label="Accent colour">
    <sc-for list="{{opts}}" as="o" hint-placeholder-count="8">
      <button type="button" role="radio" aria-checked="{{o.checked}}" onClick="{{o.pick}}" style="display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: 20px; border: 2px solid {{o.ring}}; background: #F7F6F2; font-family: inherit; color: #1B1B1F; text-align: left; cursor: pointer">
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 2px 4px 0">
          <span style="display: flex; align-items: center; gap: 10px">
            <span style="width: 18px; height: 18px; border-radius: 50%; background: {{o.fill}}; box-shadow: inset 0 0 0 1px rgba(20,20,23,0.12); display: block"></span>
            <span style="font-size: 13px; font-weight: 600">{{o.name}}</span>
          </span>
          <span style="font-size: 9px; color: #5E5E66; font-variant-numeric: tabular-nums">{{o.hex}}</span>
        </div>

        <div style="width: 100%; box-sizing: border-box; padding: 18px 16px; border-radius: 14px; background: #121215; display: flex; flex-direction: column; align-items: center; gap: 14px">
          <div style="height: 40px; padding: 0 16px 0 14px; border-radius: 999px; background: #0B0B0D; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); display: flex; align-items: center; gap: 10px">
            <span style="width: 7px; height: 7px; border-radius: 50%; background: {{o.fill}}; display: block"></span>
            <span style="display: flex; align-items: center; gap: 3px; height: 20px" aria-hidden="true">
              <span style="width: 3px; height: 8px; border-radius: 2px; background: {{o.fill}}; display: block"></span><span style="width: 3px; height: 15px; border-radius: 2px; background: {{o.fill}}; display: block"></span><span style="width: 3px; height: 20px; border-radius: 2px; background: {{o.fill}}; display: block"></span><span style="width: 3px; height: 12px; border-radius: 2px; background: {{o.fill}}; display: block"></span><span style="width: 3px; height: 17px; border-radius: 2px; background: {{o.fill}}; display: block"></span><span style="width: 3px; height: 9px; border-radius: 2px; background: {{o.fill}}; display: block"></span>
            </span>
          </div>
          <div style="display: flex; align-items: center; gap: 12px; width: 100%; justify-content: space-between">
            <span style="height: 34px; padding: 0 14px; border-radius: 10px; background: {{o.fill}}; color: {{o.onFill}}; font-size: 10px; font-weight: 600; display: flex; align-items: center">Get started</span>
            <span style="width: 36px; height: 20px; border-radius: 999px; background: {{o.fill}}; position: relative; display: block" aria-hidden="true"><span style="position: absolute; top: 3px; right: 3px; width: 14px; height: 14px; border-radius: 50%; background: {{o.onFill}}; display: block"></span></span>
            <span style="font-size: 11px; font-weight: 500; color: {{o.fill}}">0.84 s</span>
          </div>
        </div>

        <div style="width: 100%; box-sizing: border-box; padding: 18px 16px; border-radius: 14px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #E7E6E0; display: flex; flex-direction: column; align-items: center; gap: 14px">
          <div style="height: 40px; padding: 0 16px 0 14px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 6px 16px rgba(20,20,23,0.12), inset 0 0 0 1px rgba(20,20,23,0.08); display: flex; align-items: center; gap: 10px">
            <span style="width: 7px; height: 7px; border-radius: 50%; background: {{o.deep}}; display: block"></span>
            <span style="display: flex; align-items: center; gap: 3px; height: 20px" aria-hidden="true">
              <span style="width: 3px; height: 8px; border-radius: 2px; background: {{o.deep}}; display: block"></span><span style="width: 3px; height: 15px; border-radius: 2px; background: {{o.deep}}; display: block"></span><span style="width: 3px; height: 20px; border-radius: 2px; background: {{o.deep}}; display: block"></span><span style="width: 3px; height: 12px; border-radius: 2px; background: {{o.deep}}; display: block"></span><span style="width: 3px; height: 17px; border-radius: 2px; background: {{o.deep}}; display: block"></span><span style="width: 3px; height: 9px; border-radius: 2px; background: {{o.deep}}; display: block"></span>
            </span>
          </div>
          <div style="display: flex; align-items: center; gap: 12px; width: 100%; justify-content: space-between">
            <span style="height: 34px; padding: 0 14px; border-radius: 10px; background: {{o.fill}}; color: {{o.onFill}}; font-size: 10px; font-weight: 600; display: flex; align-items: center">Get started</span>
            <span style="width: 36px; height: 20px; border-radius: 999px; background: {{o.deep}}; position: relative; display: block" aria-hidden="true"><span style="position: absolute; top: 3px; right: 3px; width: 14px; height: 14px; border-radius: 50%; background: #FFFFFF; display: block"></span></span>
            <span style="font-size: 11px; font-weight: 500; color: {{o.deep}}">0.84 s</span>
          </div>
        </div>

        <span style="font-size: 10px; font-weight: 300; line-height: 1.6; color: #4A4A52; padding: 0 4px 2px">{{o.mood}}</span>
      </button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 0 };
  }
  renderVals() {
    const list = [
      { name: 'Azure · default', fill: '#5AB0FF', deep: '#0B5FB3', onFill: '#141417', mood: 'Clean and trustworthy. The safest, most "system" choice.' },
      { name: 'Coral', fill: '#FF7A59', deep: '#B23A1C', onFill: '#141417', mood: 'Lively and human. Errors switch to red so they stay distinct.' },
      { name: 'Sunflower', fill: '#FFC94D', deep: '#8A5A00', onFill: '#141417', mood: 'Warm and friendly, like a highlighter. Stands out on any wallpaper.' },
      { name: 'Violet', fill: '#9A88FF', deep: '#5B47C9', onFill: '#141417', mood: 'Calm and techy. Command mode moves to coral.' },
      { name: 'Mint', fill: '#5EE3B0', deep: '#0B7A50', onFill: '#141417', mood: 'Fresh, softer than neon green. Keeps the "go" feeling.' },
      { name: 'Tangerine', fill: '#FF9A3D', deep: '#A84E00', onFill: '#141417', mood: 'Energetic and confident. Warnings move to red.' },
      { name: 'Chalk', fill: '#ECEAE3', deep: '#17171A', onFill: '#141417', mood: 'No colour at all. Monochrome, quiet and premium.' },
    ];
    const picked = this.state.picked;
    const opts = list.map((o, i) => ({
      ...o,
      hex: o.fill,
      checked: i === picked ? 'true' : 'false',
      ring: i === picked ? '#141417' : 'transparent',
      pick: () => this.setState({ picked: i }),
    }));
    return { opts };
  }
}
</script>
</body>
</html>
