<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding · Mac permissions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;600;700&amp;family=Reem+Kufi:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5AB0FF}a:hover{color:#A9D4FF}
.yf-cta{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 24px;border-radius:14px;background:#5AB0FF;color:#141417;text-decoration:none;font-size:13px;font-weight:600}
.yf-cta:hover{color:#141417;background:#8CC8FF}
.yf-back{display:inline-flex;align-items:center;height:48px;padding:0 18px;border-radius:14px;color:#C9C9CF;text-decoration:none;font-size:12px}
.yf-back:hover{color:#F4F4F0;background:#1A1A1F}
.yf-btn{height:34px;padding:0 14px;border-radius:10px;font-family:inherit;font-size:10px;cursor:pointer;border:1px solid #2E2E36;background:transparent;color:#F4F4F0;font-weight:500;flex:none}
.yf-btn:focus-visible{outline:2px solid #5AB0FF;outline-offset:2px}
</style>
</helmet>
<div style="width: 760px; height: 560px; box-sizing: border-box; padding: 36px 48px 40px; background: #121215; color: #F4F4F0; font-family: 'Unbounded', 'Reem Kufi', sans-serif; display: flex; flex-direction: column; gap: 22px">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <span style="font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: #A3A3AD">Step 3 of 5 · macOS</span>
    <div style="display: flex; gap: 6px" aria-hidden="true">
      <span style="width: 6px; height: 6px; border-radius: 999px; background: #2F5577; display: block"></span>
      <span style="width: 6px; height: 6px; border-radius: 999px; background: #2F5577; display: block"></span>
      <span style="width: 22px; height: 6px; border-radius: 999px; background: #5AB0FF; display: block"></span>
      <span style="width: 6px; height: 6px; border-radius: 999px; background: #2E2E36; display: block"></span>
      <span style="width: 6px; height: 6px; border-radius: 999px; background: #2E2E36; display: block"></span></div>
  </div>

  <div>
    <h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.01em">Three switches in System Settings</h1>
    <p style="margin: 10px 0 0; font-size: 12px; font-weight: 300; line-height: 1.7; color: #A3A3AD">macOS asks you to allow these yourself. We'll open each page for you and tick it off when it's done.</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; flex-grow: 1">
    <sc-for list="{{perms}}" as="pm" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 16px; padding: 16px 18px; border-radius: 16px; background: #1A1A1F">
        <span style="width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; background: {{pm.badgeBg}}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{pm.badgeFg}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{pm.icon}}"></path></svg>
        </span>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 12px; font-weight: 500">{{pm.name}}</span>
          <span style="font-size: 10px; font-weight: 300; line-height: 1.6; color: #A3A3AD">{{pm.why}}</span>
        </div>
        <sc-if value="{{pm.done}}" hint-placeholder-val="{{ false }}">
          <span style="font-size: 10px; color: #5AB0FF">Allowed</span>
        </sc-if>
        <sc-if value="{{pm.todo}}" hint-placeholder-val="{{ true }}">
          <button type="button" class="yf-btn">Open settings</button>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center">
    <a class="yf-back" href="Onb2Connect.dc.html">Back</a>
    <a class="yf-cta" href="Onb3Mic.dc.html">Continue
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const check = 'M5 12.5l4.5 4.5L19 7.5';
    const dot = 'M12 12h.01';
    const perms = [
      { name: 'Microphone', why: 'To hear you. Only while the hotkey is held.', done: true },
      { name: 'Input Monitoring', why: 'To notice when you hold fn, in any app.', done: true },
      { name: 'Accessibility', why: 'To paste the text where your cursor is.', done: false },
    ].map((p) => ({
      ...p, todo: !p.done,
      icon: p.done ? check : dot,
      badgeBg: p.done ? '#5AB0FF' : '#26262D',
      badgeFg: p.done ? '#141417' : '#A3A3AD',
    }));
    return { perms };
  }
}
</script>
</body>
</html>
