<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings · Snippets</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;600;700&amp;family=Reem+Kufi:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5AB0FF}a:hover{color:#A9D4FF}
.yf-cap{margin:0;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:#A3A3AD}
.yf-in{height:42px;padding:0 12px;border-radius:12px;border:1px solid #2E2E36;background:#121215;color:#F4F4F0;font-family:inherit;font-size:12px;box-sizing:border-box;width:100%}
.yf-ta{padding:12px;border-radius:12px;border:1px solid #2E2E36;background:#121215;color:#F4F4F0;font-family:inherit;font-size:12px;line-height:1.7;box-sizing:border-box;width:100%;resize:none}
.yf-btn{height:40px;padding:0 16px;border-radius:12px;font-family:inherit;font-size:12px;cursor:pointer;border:1px solid #2E2E36;background:transparent;color:#F4F4F0;font-weight:500}
.yf-btn.p{border:0;background:#5AB0FF;color:#141417;font-weight:600}
.yf-item{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:14px;background:#1A1A1F;border:1.5px solid transparent;text-align:left;font-family:inherit;color:#F4F4F0;cursor:pointer;width:100%}
.yf-item:hover{border-color:#2E2E36}
.yf-in:focus-visible,.yf-ta:focus-visible,.yf-btn:focus-visible,.yf-item:focus-visible{outline:2px solid #5AB0FF;outline-offset:2px}
</style>
</helmet>
<div style="width: 1040px; height: 800px; display: flex; background: #121215; color: #F4F4F0; font-family: 'Unbounded', 'Reem Kufi', sans-serif">
  <dc-import name="Sidebar" active="snippets" theme="dark" hint-size="240px,800px"></dc-import>
  <main style="flex-grow: 1; min-width: 0; padding: 34px 40px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 20px">
      <div>
        <h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">Snippets</h1>
        <p style="margin: 8px 0 0; font-size: 12px; font-weight: 300; color: #A3A3AD">Say a short phrase, get the long version.</p>
      </div>
      <button type="button" class="yf-btn p">+ New snippet</button>
    </div>

    <div style="display: flex; gap: 16px; flex-grow: 1; min-height: 0">
      <div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{snips}}" as="s" hint-placeholder-count="5">
          <button type="button" class="yf-item" style="border-color: {{s.border}}">
            <span style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#5AB0FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4a3 3 0 0 1 3 3v4a3 3 0 0 1-6 0V7a3 3 0 0 1 3-3zM6 11a6 6 0 0 0 12 0M12 17v3"></path></svg>
              "{{s.trigger}}"
            </span>
            <span style="font-size: 10px; font-weight: 300; color: #A3A3AD; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%">{{s.preview}}</span>
          </button>
        </sc-for>
      </div>

      <section style="flex: 1.15 1 0; background: #1A1A1F; border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
        <h2 class="yf-cap">Edit snippet</h2>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="sn-t" style="font-size: 12px">When I say</label>
          <input id="sn-t" class="yf-in" type="text" value="sign off">
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px; flex-grow: 1">
          <label for="sn-e" style="font-size: 12px">Type this</label>
          <textarea id="sn-e" class="yf-ta" style="flex-grow: 1">Best regards,
[YOUR NAME]
[YOUR TITLE] · [YOUR COMPANY]</textarea>
        </div>
        <p style="margin: 0; font-size: 10px; font-weight: 300; line-height: 1.7; color: #A3A3AD">Works mid-sentence too: "thanks for the call, sign off" becomes the line, then the full block.</p>
        <div style="display: flex; justify-content: space-between">
          <button type="button" class="yf-btn" style="color: #FF8A5B; border-color: #3A2A24">Delete</button>
          <button type="button" class="yf-btn p">Save</button>
        </div>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1040,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const snips = [
      { trigger: 'sign off', preview: 'Best regards, [YOUR NAME] · [YOUR TITLE] · [YOUR COMPANY]', on: true },
      { trigger: 'my email', preview: '[YOUR EMAIL]' },
      { trigger: 'meeting link', preview: '[YOUR MEETING LINK]' },
      { trigger: 'office address', preview: '[YOUR OFFICE ADDRESS], Dubai' },
      { trigger: 'bug template', preview: 'Steps to reproduce: … Expected: … Actual: …' },
    ].map((s) => ({ ...s, border: s.on ? '#5AB0FF' : 'transparent' }));
    return { snips };
  }
}
</script>
</body>
</html>
