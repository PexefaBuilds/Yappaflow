<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tray menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;600;700&amp;family=Reem+Kufi:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.yf-item{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;height:40px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:#F4F4F0;font-family:inherit;font-size:11px;text-align:left;cursor:pointer;box-sizing:border-box}
.yf-item:hover{background:#26262D}
.yf-item:focus-visible{outline:2px solid #5AB0FF;outline-offset:-2px}
.yf-sw{appearance:none;-webkit-appearance:none;width:34px;height:20px;border-radius:999px;background:#2E2E36;position:relative;cursor:pointer;margin:0;flex:none}
.yf-sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#A3A3AD;transition:left .15s}
.yf-sw:checked{background:#5AB0FF}.yf-sw:checked::after{left:17px;background:#141417}
.yf-sw:focus-visible{outline:2px solid #5AB0FF;outline-offset:2px}
</style>
</helmet>
<div style="width: 520px; height: 720px; box-sizing: border-box; background: #ECEBE6; font-family: 'Unbounded', 'Reem Kufi', sans-serif; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end">
  <div role="menu" aria-label="Yappaflow" style="width: 340px; margin: 0 24px 12px 0; padding: 10px; border-radius: 18px; background: #18181C; color: #F4F4F0; box-shadow: 0 20px 50px rgba(20,20,23,0.3), inset 0 0 0 1px rgba(255,255,255,0.06); display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 8px 10px 12px">
      <div style="width: 30px; height: 30px; border-radius: 9px; background: #26262D; display: flex; align-items: center; justify-content: center; gap: 2px" aria-hidden="true">
        <svg viewBox="0 0 64 64" style="width: 82%; height: 82%" aria-hidden="true"><defs><linearGradient id="yfmTrayMenu1" gradientUnits="userSpaceOnUse" x1="8" y1="0" x2="56" y2="0"><stop offset="0.42" stop-color="#5AB0FF"></stop><stop offset="0.58" stop-color="#F4F4F0"></stop></linearGradient></defs><path d="M8 32c2-11 5-11 7 0s5 9 7 0 4-6 6 0c1.2 2.5 2.6 0 4 0h24" fill="none" stroke="url(#yfmTrayMenu1)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px">
        <span style="font-size: 12px; font-weight: 600">Yappaflow</span>
        <span style="display: flex; align-items: center; gap: 6px; font-size: 9px; color: #A3A3AD"><span style="width: 6px; height: 6px; border-radius: 50%; background: #5AB0FF; display: block"></span>Ready · On this PC · large-v3-turbo</span>
      </div>
    </div>

    <div style="margin: 0 4px 6px; padding: 12px; border-radius: 12px; background: #121215; display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 9px; color: #A3A3AD">Last · slack.exe · 2 min ago</span>
      <span style="font-size: 11px; font-weight: 300; line-height: 1.6">Sounds good, let's move the review to Wednesday at three.</span>
      <div style="display: flex; gap: 6px">
        <button type="button" style="height: 30px; padding: 0 12px; border: 0; border-radius: 8px; background: #5AB0FF; color: #141417; font-family: inherit; font-size: 10px; font-weight: 600; cursor: pointer">Paste again</button>
        <button type="button" style="height: 30px; padding: 0 12px; border: 1px solid #2E2E36; border-radius: 8px; background: transparent; color: #F4F4F0; font-family: inherit; font-size: 10px; cursor: pointer">Copy</button>
      </div>
    </div>

    <label class="yf-item" role="menuitemcheckbox" aria-checked="false">Hands-free mode<input class="yf-sw" type="checkbox"></label>
    <button type="button" class="yf-item" role="menuitem">Microphone<span style="display: flex; align-items: center; gap: 6px; color: #A3A3AD; font-size: 10px">[YOUR MIC]<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span></button>
    <button type="button" class="yf-item" role="menuitem">Pause for 1 hour</button>
    <div style="height: 1px; margin: 4px 8px; background: #26262D"></div>
    <button type="button" class="yf-item" role="menuitem">History</button>
    <button type="button" class="yf-item" role="menuitem">Settings…</button>
    <button type="button" class="yf-item" role="menuitem" style="color: #A3A3AD">Quit Yappaflow</button>
  </div>

  <div style="width: 100%; height: 48px; background: #DAD9D3; display: flex; align-items: center; justify-content: flex-end; gap: 14px; padding: 0 18px; box-sizing: border-box; font-size: 10px; color: #3A3A42">
    <div style="width: 32px; height: 32px; border-radius: 7px; background: rgba(20,20,23,0.08); display: flex; align-items: center; justify-content: center; gap: 1.5px" aria-label="Yappaflow tray icon" role="img">
      <svg viewBox="0 0 64 64" style="width: 82%; height: 82%" aria-hidden="true"><path d="M6 32c3-15 8-15 11 0s8 15 11 0c1.5-4 3-4 5 0h25" fill="none" stroke="#141417" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
    <span style="font-variant-numeric: tabular-nums">14:40</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
