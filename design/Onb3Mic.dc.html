<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding · Microphone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;600;700&amp;family=Reem+Kufi:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5AB0FF}a:hover{color:#A9D4FF}
.yf-cta{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 24px;border-radius:14px;background:#5AB0FF;color:#141417;text-decoration:none;font-size:13px;font-weight:600}
.yf-cta:hover{color:#141417;background:#8CC8FF}
.yf-back{display:inline-flex;align-items:center;height:48px;padding:0 18px;border-radius:14px;color:#C9C9CF;text-decoration:none;font-size:12px}
.yf-back:hover{color:#F4F4F0;background:#1A1A1F}
.yf-in{height:44px;padding:0 12px;border-radius:12px;border:1px solid #2E2E36;background:#121215;color:#F4F4F0;font-family:inherit;font-size:12px;box-sizing:border-box;width:100%}
.yf-in:focus-visible{outline:2px solid #5AB0FF;outline-offset:2px}
</style>
</helmet>
<div style="width: 760px; height: 560px; box-sizing: border-box; padding: 36px 48px 40px; background: #121215; color: #F4F4F0; font-family: 'Unbounded', 'Reem Kufi', sans-serif; display: flex; flex-direction: column; gap: 24px">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <span style="font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: #A3A3AD">Step 3 of 5</span>
    <div style="display: flex; gap: 6px" aria-hidden="true">
      <span style="width: 6px; height: 6px; border-radius: 999px; background: #2F5577; display: block"></span>
      <span style="width: 6px; height: 6px; border-radius: 999px; background: #2F5577; display: block"></span>
      <span style="width: 22px; height: 6px; border-radius: 999px; background: #5AB0FF; display: block"></span>
      <span style="width: 6px; height: 6px; border-radius: 999px; background: #2E2E36; display: block"></span>
      <span style="width: 6px; height: 6px; border-radius: 999px; background: #2E2E36; display: block"></span></div>
  </div>

  <div>
    <h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.01em">Let's hear you</h1>
    <p style="margin: 10px 0 0; font-size: 12px; font-weight: 300; line-height: 1.7; color: #A3A3AD">Say "testing, one, two, three" at your normal volume.</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 18px; padding: 24px; border-radius: 20px; background: #1A1A1F; flex-grow: 1; justify-content: center">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="o-mic" style="font-size: 12px">Microphone</label>
      <select id="o-mic" class="yf-in"><option>System default · [YOUR MIC]</option><option>Headset microphone</option></select>
    </div>
    <div style="display: flex; align-items: flex-end; gap: 4px; height: 64px" role="img" aria-label="Live input level">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="40">
        <span style="flex: 1 1 0; border-radius: 3px; height: {{b.h}}px; background: {{b.c}}; display: block"></span>
      </sc-for>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; font-size: 12px; color: #5AB0FF">
      <span style="width: 24px; height: 24px; border-radius: 50%; background: #5AB0FF; display: flex; align-items: center; justify-content: center">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#141417" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
      </span>
      Heard you clearly
    </div>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center">
    <a class="yf-back" href="Onb2Connect.dc.html">Back</a>
    <a class="yf-cta" href="Onb4Try.dc.html">Sounds good
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const lvl = [8, 12, 18, 26, 36, 46, 40, 54, 60, 52, 44, 58, 62, 50, 40, 34, 46, 56, 48, 38, 30, 24, 32, 40, 34, 26, 18, 12, 10, 8, 8, 6, 6, 5, 5, 5, 4, 4, 4, 4];
    return { bars: lvl.map((h, i) => ({ h, c: i < 27 ? '#5AB0FF' : '#2E2E36' })) };
  }
}
</script>
</body>
</html>
