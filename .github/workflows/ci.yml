name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned by full commit SHA (verified against each action's
# official repo on 2026-10-24). Bump the SHA and the trailing comment together.
jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # macOS support lands in Phase 8; until then a macOS failure doesn't block the PR.
    continue-on-error: ${{ matrix.os == 'macos-14' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      # Type-checks the UI and creates dist/, which Tauri needs before cargo can build.
      - name: Build UI
        run: npm run build

      - name: Rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # whisper.cpp in-process (cargo feature local-stt). Needs libclang + CMake, which the
  # GitHub runners ship (windows-latest: LLVM in C:\Program Files\LLVM; macos-14: Xcode clang).
  local-engines:
    name: Local engines (${{ matrix.os }}, ${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    # TODO: drop once both legs have gone green once; these builds have never run anywhere yet.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            features: local-stt
          - os: macos-14
            features: local-stt,metal
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # libclang for bindgen, and a short target dir: MSBuild inside whisper-rs-sys hits MAX_PATH.
      - name: Set up LLVM and a short target dir (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvm = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path "$llvm\libclang.dll")) { choco install llvm --version=18.1.8 -y --no-progress }
          "LIBCLANG_PATH=$llvm" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CARGO_TARGET_DIR=C:\t" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          cmake --version

      - name: Install npm dependencies
        run: npm ci

      - name: Build UI
        run: npm run build

      - name: Unit tests with the local engine
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --features ${{ matrix.features }}

  cargo-deny:
    name: Licences (cargo-deny)
    runs-on: ubuntu-latest # the action is a Docker action, Linux only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check licenses

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # full history so every commit is scanned

      # No GITLEAKS_LICENSE needed: the action only requires one for organisation accounts.
      # If the repo ever moves to an org, add the licence secret or run the gitleaks binary.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # Built-in token (no repo secret to configure); used to read PR commits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
