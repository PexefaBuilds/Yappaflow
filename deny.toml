# cargo-deny config (licence gate). CI runs `cargo deny --manifest-path src-tauri/Cargo.toml check licenses`.
# Anything not listed here (GPL, AGPL, LGPL, unknown, missing) fails the build.
[graph]
all-features = false

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",              # clipboard-win, error-code
  "CDLA-Permissive-2.0",  # webpki-roots (Mozilla root certificate data)
  "OFL-1.1",
  # Allowed for unmodified dependencies only. If we ever patch an MPL crate,
  # the changed files must be published under MPL-2.0.
  "MPL-2.0",
]

[licenses.private]
# Our own crate (publish = false) is MIT via LICENSE; don't gate on it.
ignore = true
