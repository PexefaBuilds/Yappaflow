<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yappaflow</title>
  <script type="module" src="/src/main.ts"></script>
</head>
<body>
  <div class="shell">
    <nav class="side" aria-label="Settings">
      <div class="brand">
        <div class="mark" aria-hidden="true"><svg viewBox="0 0 64 64"><defs><linearGradient id="yf-mark" gradientUnits="userSpaceOnUse" x1="8" y1="0" x2="56" y2="0"><stop offset="0.42" style="stop-color: var(--accent)"/><stop offset="0.58" style="stop-color: var(--text)"/></linearGradient></defs><path d="M8 32c2-24 5-24 7 0s5 19 7 0 9 0 12 0h22" fill="none" stroke="url(#yf-mark)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <span>Yappaflow</span>
      </div>
      <div class="navlist" id="nav"></div>
      <div class="statuscard" id="status" role="status" aria-live="polite">
        <div class="st"><span class="dot" id="status-dot"></span><span id="status-title">Ready</span></div>
        <div class="help" id="status-text"></div>
      </div>
    </nav>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
