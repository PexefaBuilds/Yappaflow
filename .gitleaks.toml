# gitleaks config for Yappaflow.
# Default rule set plus the key shapes of the providers Yappaflow talks to.
# Add an allowlist entry only for a proven false positive, and keep it as narrow
# as possible (an exact string or a fixtures path), never a whole source folder.
title = "Yappaflow"

[extend]
useDefault = true

[[rules]]
id = "yappaflow-openai-key"
description = "OpenAI API key (sk-, sk-proj-, sk-svcacct-, sk-admin-)"
regex = '''\bsk-(?:proj-|svcacct-|admin-)?[A-Za-z0-9_-]{20,}'''
keywords = ["sk-"]

[[rules]]
id = "yappaflow-anthropic-key"
description = "Anthropic API key"
regex = '''\bsk-ant-[A-Za-z0-9_-]{20,}'''
keywords = ["sk-ant-"]

[[rules]]
id = "yappaflow-groq-key"
description = "Groq API key"
regex = '''\bgsk_[A-Za-z0-9]{40,}'''
keywords = ["gsk_"]

[[rules]]
id = "yappaflow-google-key"
description = "Google / Gemini API key"
regex = '''\bAIza[0-9A-Za-z_-]{35}\b'''
keywords = ["aiza"]

[[rules]]
id = "yappaflow-elevenlabs-key"
description = "ElevenLabs API key (sk_ + 48 hex)"
regex = '''\bsk_[a-f0-9]{48}\b'''
keywords = ["sk_"]

# Deepgram (40 hex) and AssemblyAI / older ElevenLabs (32 hex) keys have no prefix,
# so only flag them next to the provider's name.
[[rules]]
id = "yappaflow-deepgram-key"
description = "Deepgram API key"
regex = '''(?i)deepgram[\w.-]{0,20}['"\s:=]{1,5}([a-f0-9]{40})\b'''
secretGroup = 1
keywords = ["deepgram"]

[[rules]]
id = "yappaflow-assemblyai-key"
description = "AssemblyAI API key"
regex = '''(?i)assembly[\w.-]{0,20}['"\s:=]{1,5}([a-f0-9]{32})\b'''
secretGroup = 1
keywords = ["assembly"]

[[rules]]
id = "yappaflow-elevenlabs-legacy-key"
description = "ElevenLabs API key (legacy 32 hex)"
regex = '''(?i)(?:elevenlabs|xi-api-key)[\w.-]{0,20}['"\s:=]{1,5}([a-f0-9]{32})\b'''
secretGroup = 1
keywords = ["elevenlabs", "xi-api-key"]

# Tauri updater private key: a minisign secret key, usually stored base64-encoded.
# The base64 string below is "untrusted comment: rsign encrypted secret key".
[[rules]]
id = "yappaflow-tauri-updater-key"
description = "Tauri updater (minisign) private key"
regex = '''dW50cnVzdGVkIGNvbW1lbnQ6IHJzaWduIGVuY3J5cHRlZCBzZWNyZXQga2V5|untrusted comment: (?:rsign|minisign) encrypted secret key'''
keywords = ["dw50cnvzdgvkignvbw1lbnq6ihjzawduigvuy3j5chrlzcbzzwnyzxqga2v5", "encrypted secret key"]

[allowlist]
description = "Test fixtures and the design mock's masked placeholder key"
paths = [
  '''(^|/)tests?/fixtures/''',
  '''^\.gitleaks\.toml$''',
]
regexes = [
  # design/Settings.dc.html shows a fake, visibly masked key in the API key field.
  '''sk-proj-x{20}a9F2''',
]
